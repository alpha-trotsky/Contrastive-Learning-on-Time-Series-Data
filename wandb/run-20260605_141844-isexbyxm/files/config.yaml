experiment:
    value:
        name: phase1_gp_conditional_baseline
        output_dir: results/phase1_gp_conditional_baseline
        seed: 42
logging:
    value:
        log_every: 100
        theory_match_every: 500
loss:
    value:
        inner_product: true
        lambda_u: 0.5
        lambda_v: 0.5
        type: conditional
modality:
    value:
        future_len: 50
        past_len: 50
        sigma_u: 0.05
        sigma_v: 0.05
        start: 0
        type: PastFuture
model:
    value:
        bias: false
        embed_dim: 20
        init_logit_scale: 2.659
        type: linear_clip
signal:
    value:
        alpha: 2
        dim_true: 1000
        tau: 3
        type: gaussian_process_1d
        zero_mean: true
training:
    value:
        batch_size: 256
        lr: 0.005
        num_steps: 100000
        optimizer: adam
