# Temp sweep: fill missing retrieval eval for the 3 variants whose evening
# (retrieval-enabled) run crashed.  20k steps is enough for the retrieval stats.
base_config: config.yaml

runs:
  - name: fill_one_sided_v_dot
    overrides:
      modality: {past_len: 50, future_len: 50}
      loss: {type: one_sided_v, inner_product: true, lambda_u: 0.0, lambda_v: 1.0}
      training: {num_steps: 20000}

  - name: fill_one_sided_v_l2
    overrides:
      modality: {past_len: 50, future_len: 50}
      loss: {type: one_sided_v, inner_product: false, lambda_u: 0.0, lambda_v: 1.0}
      training: {num_steps: 20000}

  - name: fill_mse
    overrides:
      modality: {past_len: 50, future_len: 50}
      loss: {type: mse}
      training: {num_steps: 20000}
