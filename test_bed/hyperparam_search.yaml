# Hyperparameter search: batch_size x lr (12 runs)
# Fixed: 50x50, conditional loss, inner_product: true, 25000 steps
# Run this first, then use best lr/batch_size for research runs.

base_config: config.yaml

runs:
  - name: hp_bs64_lr1e4
    overrides: {training: {batch_size: 64,  lr: 1.0e-4, num_steps: 100000}}

  - name: hp_bs64_lr5e4
    overrides: {training: {batch_size: 64,  lr: 5.0e-4, num_steps: 100000}}

  - name: hp_bs64_lr1e3
    overrides: {training: {batch_size: 64,  lr: 1.0e-3, num_steps: 100000}}

  - name: hp_bs64_lr5e3
    overrides: {training: {batch_size: 64,  lr: 5.0e-3, num_steps: 100000}}

  - name: hp_bs256_lr1e4
    overrides: {training: {batch_size: 256, lr: 1.0e-4, num_steps: 100000}}

  - name: hp_bs256_lr5e4
    overrides: {training: {batch_size: 256, lr: 5.0e-4, num_steps: 100000}}

  - name: hp_bs256_lr1e3
    overrides: {training: {batch_size: 256, lr: 1.0e-3, num_steps: 100000}}

  - name: hp_bs256_lr5e3
    overrides: {training: {batch_size: 256, lr: 5.0e-3, num_steps: 100000}}

  - name: hp_bs1024_lr1e4
    overrides: {training: {batch_size: 1024, lr: 1.0e-4, num_steps: 50000}}

  - name: hp_bs1024_lr5e4
    overrides: {training: {batch_size: 1024, lr: 5.0e-4, num_steps: 50000}}

  - name: hp_bs1024_lr1e3
    overrides: {training: {batch_size: 1024, lr: 1.0e-3, num_steps: 50000}}

  - name: hp_bs1024_lr5e3
    overrides: {training: {batch_size: 1024, lr: 5.0e-3, num_steps: 50000}}
