blackbox:
  M: 300
  bank: 20000
  n_test: 300
  n_test_final: 1000
experiment:
  name: weather_A_ncos_mlp_s1
  output_dir: results/weather/A_ncos_mlp_s1
  seed: 1
logging:
  blackbox_every: 250
  log_every: 100
  theory_match_every: 500
loss:
  inner_product: true
  lambda_u: 0.5
  lambda_v: 0.5
  normalize: true
  type: conditional
modality:
  bank: heldout
  bank_block: 1008
  bank_every: 4
  fractions:
  - 0.7
  - 0.1
  - 0.2
  future_len: 36
  past_len: 144
  past_stride: 3
  type: weather
  u_groups:
  - temperature
  - moisture
  - pressure
  - wind
  - radiation
  - rain
  v_groups:
  - temperature
  v_relative: false
model:
  depth: 2
  embed_dim: 100
  hidden: 256
  init_logit_scale: 2.659
  skip: true
  type: mlp_clip
training:
  batch_size: 256
  early_stopping: true
  lr: 0.0003
  num_steps: 10000
  optimizer: adam
